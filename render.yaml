# Render Blueprint (GDD 15.5). Create it in Render: New > Blueprint > connect giovaglucho/Velmora (branch main).
# Free plans only for now (no paid services). Trade-off: free web services sleep after 15 min idle;
# the relay must move to a paid plan before live multiplayer (Fase 9). See docs/adr/ADR-004-render-blueprint.md.
# Every push to main redeploys (autoDeploy). Region is frankfurt for all services and the Key Value store.
services:
  # --- Static client + devlog ---
  - type: web
    runtime: static
    name: reinos-web
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @reinos/client build
    staticPublishPath: packages/client/dist
    autoDeploy: true
    # Cross-origin isolation (SharedArrayBuffer / Web Worker sim). Every third-party asset must then send CORP/CORS.
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
    routes:
      # Keep the static devlog out of the SPA fallback (first match wins).
      - type: rewrite
        source: /devlog/*
        destination: /devlog/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '22'

  # --- REST API (placeholder: /health and /api/v1/ping) ---
  - type: web
    runtime: node
    name: reinos-api
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @reinos/server build
    startCommand: pnpm --filter @reinos/server start:api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'

  # --- WebSocket lockstep relay (placeholder: /health) ---
  - type: web
    runtime: node
    name: reinos-relay
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @reinos/server build
    startCommand: pnpm --filter @reinos/server start:relay
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'

  # --- Redis-compatible Key Value (matchmaking, presence, sessions; unused until Fase 8-9) ---
  - type: keyvalue
    name: reinos-kv
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only
